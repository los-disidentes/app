name: Actualizar datos de la Liga

# Trae fixture, tabla y resultados de ligacountrysur.com.ar y los commitea si
# cambiaron. Antes esto se hacía a mano después de cada fecha, y el equipo veía
# datos viejos hasta que alguien se acordara de actualizar.
#
# Corría una sola vez por día, a las 23:00 UTC (20:00 en Argentina), asumiendo
# que a esa hora los resultados del domingo ya estaban cargados. No es así: la
# Liga los carga cuando puede, y a veces al día siguiente.
#
# Qué pasó el 30/08/2026: la 5ta A ganó 2-1 y Pablo Aeid ganó su doble 6-0 6-1.
# El robot corrió a las 22:03 y la Liga todavía no lo había publicado. Hasta la
# corrida del día siguiente la app mostró a los dos ganadores con 0% de
# victorias. Con los stats mintiendo un día entero, el equipo deja de creerles.
#
# Cada 2 horas. El script sólo commitea si los datos cambiaron, así que las
# corridas en las que la Liga no publicó nada no dejan ruido en el historial.
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:        # botón "Run workflow" en la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install --quiet requests beautifulsoup4

      - name: Leer la Liga y actualizar los JSON
        run: python actualizar-liga.py

      # El script sólo escribe si los datos pasan todas las validaciones, así que
      # si hay cambios en el árbol es porque son datos buenos.
      - name: Commitear si hubo cambios
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Sin cambios: la Liga no publicó nada nuevo."
            exit 0
          fi
          git config user.name  "Robot de la Liga"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A y no una lista fija: cuando el script empezó a generar
          # resultados-*.json, la lista vieja los dejaba afuera y el robot
          # commiteaba sin ellos sin avisar de nada.
          git add -A -- '*.json'
          git commit -m "Datos de la Liga actualizados automáticamente"
          git push
          echo "Datos actualizados y publicados."
