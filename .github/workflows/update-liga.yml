name: Actualizar datos de la liga (legacy, a mano)

# Este robot escribe fixture.json, standings.json y results/, que son los
# archivos del modelo viejo, de antes de separar los datos por equipo. La app
# ya no los lee salvo como respaldo si falla el proxy de la Liga, y encima
# consultan el campeonato 2155, que es el Apertura ya terminado.
#
# Corría cada 2 horas actualizando archivos que casi nadie mira, mientras el
# robot que genera los datos que la app SÍ usa (actualizar-liga.yml) corría una
# vez por día. Estaba exactamente al revés.
#
# Se le saca el horario y queda disponible a mano desde la pestaña Actions. No
# se borra: el respaldo sigue sirviendo el día que el proxy se caiga.
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch all liga data
        run: |
          python3 << 'PYEOF'
          import urllib.request, urllib.parse, json, sys, os

          CAMP_ID = '2155'
          BASE    = 'https://www.ligacountrysur.com.ar'
          HEADERS = {
            'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120',
            'Accept':     'application/json, */*',
            'Referer':    BASE + '/',
          }

          def fetch_direct(url):
            req = urllib.request.Request(url, headers=HEADERS)
            with urllib.request.urlopen(req, timeout=12) as r:
              return json.loads(r.read())

          def fetch_via_proxy(url):
            proxy = 'https://api.allorigins.win/get?url=' + urllib.parse.quote(url)
            req = urllib.request.Request(proxy, headers={'User-Agent': 'Mozilla/5.0'})
            with urllib.request.urlopen(req, timeout=18) as r:
              result = json.loads(r.read())
              raw = result.get('contents', '')
              return json.loads(raw)

          def fetch_url(url):
            for name, fn in [('direct', fetch_direct), ('allorigins', fetch_via_proxy)]:
              try:
                data = fn(url)
                if data is not None:
                  print(f'  OK via {name}')
                  return data
              except Exception as e:
                print(f'  {name} failed: {e}')
            return None

          # --- fixture ---
          print('Fetching fixture...')
          url = f'{BASE}/api/fixture_mod.php?NroCampeonato={CAMP_ID}'
          data = fetch_url(url)
          # NUNCA pisar el archivo si la API no responde: la API vieja de la liga
          # murio (404) y esto sobreescribia el fixture con 'null' cada 2 horas,
          # dejando la app sin datos para todos.
          if data:
            with open('fixture.json', 'w') as f:
              json.dump(data, f)
          else:
            print('Sin datos de fixture -> conservo fixture.json actual')

          # --- standings ---
          print('Fetching standings...')
          url = f'{BASE}/api/tabla_posiciones.php?NroCampeonato={CAMP_ID}'
          data = fetch_url(url)
          if data:
            with open('standings.json', 'w') as f:
              json.dump(data, f)
          else:
            print('Sin datos de posiciones -> conservo standings.json actual')

          # --- match results ---
          os.makedirs('results', exist_ok=True)
          try:
            with open('fixture.json') as f:
              fixture = json.load(f)
          except Exception:
            fixture = None

          if fixture:
            kw = ['disidentes', 'miralagos los']
            for fecha in fixture:
              for p in fecha.get('partidos', []):
                local = (p.get('Local') or '').lower()
                visit = (p.get('Visitante') or '').lower()
                if not any(k in local or k in visit for k in kw):
                  continue
                nid = p.get('NroPartidoCampeonato')
                if not nid:
                  continue
                print(f'Fetching result {nid}...')
                url = f'{BASE}/resultadopartidotenis_visita.php?NroPartidoCampeonato={nid}'
                rdata = fetch_url(url)
                if rdata:
                  with open(f'results/{nid}.json', 'w') as f:
                    json.dump(rdata, f)
          PYEOF

      - name: Commit si hay cambios
        run: |
          git config user.email "bot@los-disidentes.github.io"
          git config user.name "Liga Data Bot"
          git add fixture.json standings.json results/ 2>/dev/null || true
          git diff --staged --quiet \
            || git commit -m "Liga data $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push || true
